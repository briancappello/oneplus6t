# Stop before the monitor daemon this unit's own ExecStop depends on.
#
# lxc.service stops containers with `lxc-containers stop`, which uses
# lxc-autostart, which asks lxc-monitord for container state. With no ordering,
# lxc-monitord was stopped first and lxc-autostart hit the same dead end
# lxc-wait did:
#
#   lxc-autostart: lxc_cmd_sock_rcv_state: Resource temporarily unavailable
#
# costing another ~15s of stop timeout on every shutdown.
[Unit]
After=lxc-monitord.service
