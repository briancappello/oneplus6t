# Use a stop script that can tell when the container has stopped.
#
# The stock ExecStop ends in `lxc-wait -n android -s STOPPED -t 30`, which
# cannot observe a container that stops while it is waiting and therefore
# always burns its full 30s. See the replacement for the detail.
[Service]
ExecStop=
ExecStop=/usr/lib/adaptation-oneplus-fajita/lxc-android-stop
