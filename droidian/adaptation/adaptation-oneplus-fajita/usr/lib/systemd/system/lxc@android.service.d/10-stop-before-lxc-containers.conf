# Stop this container before lxc.service tears every container down.
#
# lxc.service is the autoboot unit and carries
# ExecStop=/usr/libexec/lxc/lxc-containers stop, which stops the android
# container too. Nothing orders the two, and lxc.service wins:
#
#   Stopping lxc.service ...          273.0
#   Stopped  lxc.service              355.1
#   Stopping lxc@android.service ...  405.1
#
# By then Android's init is gone, so the graceful request in lxc-android-stop
# reaches nothing:
#
#   lxc-android-stop: Unable to set property "sys.powerctl" to "shutdown":
#                     connection failed; errno=111 (Connection refused)
#
# and the lxc-wait after it burns its full 30s waiting for a container that was
# already killed. Android never shuts itself down, so the modem is never told to
# stop and gets force-halted with rmnet_ipa0 still up -- which is what wedges the
# netdev and drags shutdown out to minutes.
#
# After= is reversed on shutdown, so this stops the container first, while its
# init is still alive to answer sys.powerctl.
#
[Unit]
After=lxc.service
