# Stop this container before lxc.service tears every container down.
#
# lxc.service is the autoboot unit and carries
# ExecStop=/usr/libexec/lxc/lxc-containers stop, which stops the android
# container too. Nothing ordered the two, and lxc.service usually won: it
# stopped ~87s before lxc@android's own ExecStop ran.
#
# By then Android's init was gone, so lxc-android-stop's graceful request
# reached nothing:
#
#   lxc-android-stop: Unable to set property "sys.powerctl" to "shutdown":
#                     connection failed; errno=111 (Connection refused)
#
# and the lxc-wait that follows it then burned its full 30s timeout waiting for
# a container that had already been killed. Android never got to shut itself
# down, which is also why the modem was never told to stop and had to be
# force-halted.
#
# lxc-monitord is ordered for the same reason. It is the daemon lxc-wait asks
# for container state, and it was being stopped ~1.5s before the container
# teardown even began, so the lxc-wait in lxc-android-stop had nothing to ask:
#
#   lxc-wait: android: lxc_cmd_sock_rcv_state: Resource temporarily unavailable
#   lxc-wait: android: lxc_wait: Failed to receive state from monitor
#
# It then sat out its full 30s timeout and was SIGKILLed, every shutdown, while
# the container underneath it had already stopped.
#
# After= is reversed on shutdown, so this stops the container before both,
# while its init is still alive to answer sys.powerctl and the monitor is still
# alive to report that it worked.
[Unit]
After=lxc.service lxc-monitord.service
