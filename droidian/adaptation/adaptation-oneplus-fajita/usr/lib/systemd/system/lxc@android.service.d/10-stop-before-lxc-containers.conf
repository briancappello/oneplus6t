# Stop this container before lxc.service tears every container down.
#
# lxc.service is the autoboot unit and carries
# ExecStop=/usr/libexec/lxc/lxc-containers stop, which stops the android
# container too. Nothing ordered the two, and lxc.service usually won: it
# stopped ~87s before lxc@android's own ExecStop ran.
#
# By then Android's init was gone, so lxc-android-stop's graceful request
# reached nothing:
#
#   lxc-android-stop: Unable to set property "sys.powerctl" to "shutdown":
#                     connection failed; errno=111 (Connection refused)
#
# and the lxc-wait that follows it then burned its full 30s timeout waiting for
# a container that had already been killed. Android never got to shut itself
# down, which is also why the modem was never told to stop and had to be
# force-halted.
#
[Unit]
After=lxc.service
