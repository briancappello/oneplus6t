# Do not stop Android services individually while the whole system is going
# down. Android's init stops them all itself in ~3s on sys.powerctl; doing it
# per-service over binder as well is what made shutdown bimodal (~200-250s when
# this path engaged, ~41-50s when it did not). See the replacement script.
[Service]
ExecStop=
ExecStop=/usr/lib/adaptation-oneplus-fajita/android-service-stop %i
