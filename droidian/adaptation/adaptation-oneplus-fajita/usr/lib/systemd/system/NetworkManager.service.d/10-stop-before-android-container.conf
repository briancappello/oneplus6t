# Stop before the Android container is torn down.
#
# The modem is shut down by a QMI handshake: sysmon-qmi asks it to stop and
# waits for it to set a shutdown_ack SMP2P bit. The userspace counterpart the
# modem talks to lives inside the Android LXC container. With no ordering
# between them, systemd tears both down in parallel, the container usually wins,
# and the ack never comes:
#
#   sysmon-qmi: sysmon_send_shutdown: shutdown_ack SMP2P bit for modem not set
#   subsys-restart: [modem]: Timed out waiting for shutdown ack
#   pil-q6v5-mss: Port 0000000000000000 halt timeout
#
# The kernel then force-halts the modem, which leaves rmnet_ipa0's transmit
# queue wedged (NETDEV WATCHDOG), and anything touching that netdev blocks in
# uninterruptible sleep where SIGKILL cannot reach it. systemd then waits out
# every stop timeout in turn, which is most of a ~223s shutdown.
#
# After= is reversed on shutdown, so this stops this unit before the container
# and leaves the modem something to answer to. ofono already carries the same
# ordering; this extends it to the units that were missing it.
[Unit]
After=lxc@android.service
